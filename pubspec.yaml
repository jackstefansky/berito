name: berito
description: "University project app mocking the MeritoGO student portal"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  adaptive_platform_ui: ^1.0.1
  bloc: ^8.1.4
  bloc_presentation: ^1.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^14.2.1
  http: ^1.6.0
  injectable: ^3.0.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  build_runner: ^2.16.1
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-400.ttf
        - asset: assets/fonts/Rubik-500.ttf
          weight: 500
        - asset: assets/fonts/Rubik-600.ttf
          weight: 600
        - asset: assets/fonts/Rubik-700.ttf
          weight: 700
        - asset: assets/fonts/Rubik-800.ttf
          weight: 800
        - asset: assets/fonts/Rubik-900.ttf
          weight: 900
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-400.ttf
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
